name: 构建并推送 Docker 镜像

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发原因"
        required: false

jobs:
  build:
    name: 构建 ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 生成版本号
        id: version
        run: |
          BASE_VERSION="$(cat VERSION 2>/dev/null | tr -d '[:space:]')"
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="$(git describe --tags --always 2>/dev/null || echo 'dev')"
          fi
          VERSION="${BASE_VERSION}-$(date +'%Y%m%d')-$(git rev-parse --short HEAD)"
          echo "$VERSION" > VERSION
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "构建版本: $VERSION (${{ matrix.arch }})"

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            yuner4827/new-api:latest-${{ matrix.arch }}
            yuner4827/new-api:${{ steps.version.outputs.value }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  manifest:
    name: 创建多架构 manifest
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 生成版本号
        id: version
        run: |
          BASE_VERSION="$(cat VERSION 2>/dev/null | tr -d '[:space:]')"
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="$(git describe --tags --always 2>/dev/null || echo 'dev')"
          fi
          VERSION="${BASE_VERSION}-$(date +'%Y%m%d')-$(git rev-parse --short HEAD)"
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 创建 latest manifest
        run: |
          docker buildx imagetools create \
            -t yuner4827/new-api:latest \
            yuner4827/new-api:latest-amd64 \
            yuner4827/new-api:latest-arm64

      - name: 创建版本号 manifest
        run: |
          docker buildx imagetools create \
            -t yuner4827/new-api:${VERSION} \
            yuner4827/new-api:${VERSION}-amd64 \
            yuner4827/new-api:${VERSION}-arm64
